<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiada Talian | Kwikezee Design Solution</title>
  <style>
    :root {
      --primary: #2563EB;
      --dark: #0B0F19;
      --white: #FFFFFF;
      --text-muted: #94A3B8;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--dark);
      color: var(--white);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
      overflow: hidden;
      background-image: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.12) 0%, transparent 60%);
    }
    
    .container {
      max-width: 400px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    
    .icon {
      font-size: 4rem;
      margin-bottom: 20px;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    
    p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }
    
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
      color: var(--white);
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔌</div>
    <h1>Anda Sedang Offline</h1>
    <p>Sambungan internet anda terputus. Sila periksa rangkaian data atau Wi-Fi anda dan cuba sebentar lagi.</p>
    <button onclick="window.location.reload();" class="btn">Cuba Semula</button>
  </div>
</body>
</html>
